site: disko
aoi: shp/disko_aoi_v2.shp
target_epsg: 32622

# Raw HDF download destination
hdf_dir: /mnt/glaciologi/GEM/remote_sensing_and_modelling/data/MODIS_CGF_SCF/disko/

# MODIS product and time range
modis_product: MOD10A1F
temporal_start: "2000-02-24"
temporal_end: "2025-12-31"

# Masking shapefiles
land_shp: /home/shl/mdrev/data/sdfi/G250_VEKTOR/Land.shp
ice_shp: /home/shl/mdrev/data/sdfi/G250_VEKTOR/Is.shp

# In situ validation
station_id: disko
aws_stations: data/mast_locations_proximity.csv
gem_dir: /home/shl/mdrev/data/GEM/disko/
insitu_temperature: "AWS2-Meteorology_10.17897_CSZT-F010_data.txt"
insitu_snowdepth: "AWS2-SnowDepth_10.17897_SCXW-S288_data.txt"
insitu_swin: "AWS2-Meteorology_10.17897_CSZT-F010_data.txt"
insitu_swout: "AWS2-Meteorology_10.17897_CSZT-F010_data.txt"

# Column name overrides (Disko files differ from the Zackenberg/Nuuk standard)
insitu_col_temperature: "Air temperature_°C"   
insitu_col_sri: "Shortwave incoming radiation_Wm-2"  
insitu_col_sro: "Shortwave outgoing radiation_Wm-2"  
insitu_col_snowdepth: "Snow depth_m"           
insitu_time_col_snowdepth: "Time (UTC-3)"    

